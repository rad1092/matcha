# Push a tag such as v0.1.2 to build the web player, the Claude plugin and the
# command-line tool for every platform, and create a draft release with them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Tag, Cargo.toml, MCP server and plugin agree on the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" Cargo.toml
          grep -q "version: \"$version\"" mcp/server.mjs
          grep -q "\"version\": \"$version\"" plugin/.claude-plugin/plugin.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: matcha }
          - { os: macos-14, target: aarch64-apple-darwin, exe: matcha }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: matcha }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: matcha.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p matcha-cli
      - name: Package
        shell: bash
        run: |
          name="matcha-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          test "$(target/release/${{ matrix.exe }} version)" = "matcha ${{ needs.version.outputs.version }}"
          target/release/${{ matrix.exe }} info web/roms/2048.gb
          mkdir -p "dist/$name"
          cp "target/release/${{ matrix.exe }}" LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then 7z a -bd "$name.zip" "$name" >/dev/null; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node mcp/test.mjs
      - run: node scripts/build-web.mjs
      - run: scripts/build-plugin.sh
      - run: cp web/roms/LICENSES.md dist/HOMEBREW-LICENSES.md
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: |
            dist/matcha.html
            dist/matcha.plugin
            dist/HOMEBREW-LICENSES.md
          if-no-files-found: error

  publish:
    needs: [version, cli, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft --title "Matcha $GITHUB_REF_NAME" \
            --notes "Web player, Claude plugin, and the command-line tool for macOS, Windows and Linux." ./*
